<!DOCTYPE html>
<html>
<script data-goatcounter="https://rodfloripa.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<head>
  <meta http-equiv="refresh" content="5; url=https://github.com/rodfloripa">
  <title>Meu GitHub</title>
  <style>
    body { 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
    }

    h1 {
      font-size: 2.5em;
      text-align: center;
      margin-top: 30px;
    }

    .wave-container {
      position: relative;
      width: 250px;
      height: 250px;
    }

    .logo {
      width: 100%;
      height: 100%;
      filter: brightness(0) invert(1); /* deixa o logo branco */
    }

    .water {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1f6feb;
      mix-blend-mode: screen;
      animation: rise 4s ease-in-out forwards;
      -webkit-mask: url(#wave-mask);
      mask: url(#wave-mask);
    }

    @keyframes rise {
      0% { 
        height: 0%; 
        transform: translateY(20px);
      }
      100% { 
        height: 100%; 
        transform: translateY(0px);
      }
    }

    .wave {
      position: absolute;
      bottom: 0;
      width: 200%;
      animation: wave 3s linear infinite;
    }

    @keyframes wave {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <div class="wave-container">
    <img src="foto.png" alt="GitHub Logo" class="logo">
    <div class="water"></div>
    
    <!-- SVG das ondas -->
    <svg width="0" height="0">
      <defs>
        <mask id="wave-mask">
          <rect x="0" y="0" width="100%" height="100%" fill="white"/>
          <path class="wave" fill="black" d="M0,192 C220,100 440,100 660,192 L660,864 L0,864 Z"/>
          <path class="wave" fill="black" d="M0,192 C220,100 440,100 660,192 L660,864 L0,864 Z" style="transform: translateX(-50%); opacity: 0.5"/>
        </mask>
      </defs>
    </svg>
  </div>

  <h1>Seja bem vindo!!!!</h1>
</body>
</html>
